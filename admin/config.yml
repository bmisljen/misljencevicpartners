backend:
  name: git-gateway
  #repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME # Replace with your repo info
  branch: master # or master, depending on your default branch
  site_domain: "https://misljencevicpartners.com" # Replace with your site domain

media_folder: "assets/images" # Where images will be saved
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Header Image", name: "header_image", widget: "image", required: false, tagname: "header" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Category", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
